<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'">
<link rel="stylesheet" href="overlay.css"><title>DSH Screenshot</title></head>
<body><div id="selection"></div><canvas id="image"></canvas>
<div id="handles" hidden><i data-edge="nw"></i><i data-edge="n"></i><i data-edge="ne"></i><i data-edge="e"></i><i data-edge="se"></i><i data-edge="s"></i><i data-edge="sw"></i><i data-edge="w"></i></div>
<div id="toolbar" hidden>
<button data-tool="select" title="移动选区；拖动边缘手柄可调整大小">↔</button>
<button data-tool="rect" title="矩形">▭</button><button data-tool="ellipse" title="椭圆">◯</button>
<button data-tool="arrow" title="箭头">↗</button><button data-tool="pen" title="画笔">✎</button>
<button data-tool="mosaic" title="马赛克">▦</button><button data-tool="text" title="文字">T</button>
<input id="color" type="color" value="#ff3b30" title="颜色"><select id="weight" title="粗细"><option value="2">细</option><option value="4" selected>中</option><option value="8">粗</option></select>
<button id="undo" title="撤销 Ctrl+Z">↶</button><button id="save" title="保存 PNG">保存</button>
<button id="complete" title="完成 Enter / 双击">完成 ✓</button><button id="close" title="关闭 Esc / 右键">✕</button>
<span id="size"></span></div>
<input id="text" hidden placeholder="输入文字，Enter 确认">
<div id="error" hidden></div><script src="overlay.js"></script></body></html>
