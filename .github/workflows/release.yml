name: Windows beta release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Host state and selection tests
        shell: pwsh
        run: |
          node --experimental-vm-modules tests/host_test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/selection_settings_test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/client_install_test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check JavaScript and Windows PowerShell sources
        shell: powershell
        run: |
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs', '.mjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { throw "Syntax check failed: $($_.Name)" }
          }
          Get-ChildItem -File -Filter *.ps1 | ForEach-Object {
            if (([IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1)) { throw 'PowerShell script must be ASCII' }
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build portable ZIP and npm tarball
        shell: powershell
        run: |
          .\build_portable.ps1
          npm pack --pack-destination dist
          if ($LASTEXITCODE) { throw 'npm pack failed' }
          . .\install_common.ps1
          Get-ChildItem dist -File -Filter *.tgz | ForEach-Object {
            Write-ShotText ($_.FullName + '.sha256') ((Get-ShotHash $_.FullName) + '  ' + $_.Name + "`n")
          }
      - name: Upload verified assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-beta
          path: |
            dist/*.zip
            dist/*.tgz
            dist/*.sha256
  release-notices:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Remove broken beta.2 release and keep current notes consistent
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const currentTag = 'v' + version;
            // The owner requested removal of this exact broken version.
            // Keep both operations idempotent; never remove other releases.
            const retiredTag = 'v0.7.0-beta.2';
            try {
              const { data: old } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: retiredTag });
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: old.id });
            } catch (error) { if (error.status !== 404) throw error; }
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref: 'tags/' + retiredTag });
            } catch (error) { if (error.status !== 404) throw error; }
            try {
              const { data: current } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: currentTag });
              await github.rest.repos.updateRelease({ ...context.repo, release_id: current.id,
                body: fs.readFileSync('RELEASE_NOTES.md', 'utf8') });
            } catch (error) { if (error.status !== 404) throw error; }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-beta
          path: dist
      - name: Publish prerelease with assets
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = context.ref.slice('refs/tags/'.length);
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (tag !== 'v' + manifest.version) throw new Error('Tag must match package version');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: 'DSH Shot ' + manifest.version,
              body: fs.readFileSync('RELEASE_NOTES.md', 'utf8'), prerelease: manifest.version.includes('-')
            });
            for (const name of fs.readdirSync('dist').filter(n => /\.(zip|tgz|sha256)$/.test(n))) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('dist', name))
              });
            }
